apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-http-deployment
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: go-http
  template:
    metadata:
      labels:
        app: go-http
    spec:
      containers:
        - name: go-http
          image: {{ .Values.image }}
          imagePullPolicy: Never
          ports:
            - containerPort: {{ .Values.containerPort }}
          env:
            - name: DB_HOST
              value: "{{ .Values.config.DB_HOST }}"
            - name: DB_USER
              value: "{{ .Values.config.DB_USER }}"
            - name: DB_PASSWORD
              value: "{{ .Values.config.DB_PASSWORD }}"
            - name: DB_NAME
              value: "{{ .Values.config.DB_NAME }}"
            - name: DB_PORT
              value: "{{ .Values.config.DB_PORT }}"
            - name: DB_DIALECT
              value: "{{ .Values.config.DB_DIALECT }}"
