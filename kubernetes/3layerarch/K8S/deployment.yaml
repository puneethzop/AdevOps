  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: go-http-deployment
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: go-http
    template:
      metadata:
        labels:
          app: go-http
      spec:
        containers:
          - name: go-http
            image: go-http-server:1.1
            imagePullPolicy: Never
            ports:
              - containerPort: 8000
            envFrom:
              - configMapRef:
                  name: test-service-env
